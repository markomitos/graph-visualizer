<script src="https://d3js.org/d3.v7.min.js"></script>
            {{ visualization_html | safe }}
<script>
    const svg = d3.select("#center-graph-svg");
    const g = d3.select("#center-graph-g");
    const birdSVG = d3.select("#bird-graph-svg");
    const rect = d3.select("#bird-view-scope");
    // Get all <g> tags with class "node"
    const nodes = document.querySelectorAll('g.node');

    function updateMainViewFocusColor(vertexId){
            const nodes = document.querySelectorAll('g.node');
            nodes.forEach(node => {
                let id = node.querySelectorAll('text')[0].textContent;
                if(id === vertexId){
                    let secondRect = node.querySelectorAll('rect')[1];
                    if(secondRect === undefined){
                        secondRect = node.querySelectorAll('circle')[0];
                        secondRect.setAttribute('fill', 'red');
                    }else{
                        secondRect.setAttribute('fill', 'red');

                    }
                } else {
                    let secondRect = node.querySelectorAll('rect')[1];
                    if(secondRect === undefined){
                        secondRect = node.querySelectorAll('circle')[0];
                        secondRect.setAttribute('fill', '#1f77b4');
                    }else{
                        secondRect.setAttribute('fill', '#75d1f0');

                    }
                }
            });
        }

    // Add click event listener to each node
    nodes.forEach(node => {
        node.addEventListener('click', function() {
            let id = node.querySelectorAll('text')[0].textContent;
            updateTreeFocusColor(id);
            // Reset the color of all nodes' second rects to #1f77b4
            nodes.forEach(n => {
                let secondRect = n.querySelectorAll('rect')[1];
                if(secondRect === undefined){
                    secondRect = n.querySelectorAll('circle')[0];
                    secondRect.setAttribute('fill', '#1f77b4');

                }else{
                    secondRect.setAttribute('fill', '#75d1f0');

                }


            });

            // Change the color of the clicked node's second rect to red
            let secondRect = this.querySelectorAll('rect')[1];
            if(secondRect === undefined){
                    secondRect = this.querySelectorAll('circle')[0];
            }
            secondRect.setAttribute('fill', 'red');
        });
    });
    svg.append("defs")
        .append("marker")
        .attr("id", "arrowhead")
        .attr("markerWidth", 10)
        .attr("markerHeight", 7)
        .attr("refX", 10)
        .attr("refY", 3.5)
        .attr("orient", "auto")
        .append("polygon")
        .attr("points", "0 0, 10 3.5, 0 7")
        .attr("fill", "gray")

    const zoom = d3.zoom()
        .scaleExtent([1/2, 4]) // Set the minimum and maximum zoom levels
        .on("zoom", zoomed);

    svg.call(zoom);

    function zoomed(event) {
        g.attr("transform", event.transform);

        const centerTransform = event.transform;

        const scaleX = centerTransform.k;
        const scaleY = centerTransform.k;
        const translateX = centerTransform.x;
        const translateY = centerTransform.y;

        // Calculate the dimensions of the red rectangle based on the zoom level
        const viewBox = svg.attr("viewBox").split(" ");
        const viewBoxWidth = parseFloat(viewBox[2]);
        const viewBoxHeight = parseFloat(viewBox[3]);

        const rectWidth = viewBoxWidth / scaleX;
        const rectHeight = viewBoxHeight / scaleY;

        // Calculate the position of the red rectangle based on the translation
        const rectX = -translateX / scaleX;
        const rectY = -translateY / scaleY;

        // Update the existing red rectangle attributes
        rect.attr("x", rectX)
            .attr("y", rectY)
            .attr("width", rectWidth)
            .attr("height", rectHeight)
            .attr("stroke", "red")
            .attr("stroke-width", 2)
            .attr("fill", "none");
    }


    const refreshButton = document.getElementById('refreshButton');
    const svgForReset = document.getElementById('bird-graph-svg');
    // Add click event listener to the button
    refreshButton.addEventListener('click', function() {
        svgForReset.setAttribute("viewBox", "0 0 0 0");
        console.log("Bird view refreshed!");
    });
</script>
