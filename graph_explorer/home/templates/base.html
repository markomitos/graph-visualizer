<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    {% load static %}
    <script type="text/javascript" src="https://d3js.org/d3.v3.js"></script>
    <link rel="stylesheet" href="{% static 'style.css' %}"/>
    <title>{{title}}</title>
    {% block head_sadrzaj %}{% endblock %}
    {% block extra_css %}{% endblock %}
    <style>
    .content_graph{
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: row;
    }
    #bubbles-container {
        display: flex;
        align-items: center;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 5px;
    }
    .bubble {
        background-color: #ffffff;
        border-radius: 20px;
        padding: 10px;
        border-style: solid;
        border-width: thin;
        border-color: slateblue;
    }
    #bird-view{
        width: 99%;
        height: 200px;
        border: black solid 1px;
    }
    .center{
     width: 80%;
    }

    .delete-btn {
        cursor: pointer;
        margin-left: 10px;
        color: red;
    }

    .bottom-right {
        border-left: 1px black solid;
        display: flex;
        justify-items: center;
        padding: 5px 10px 5px 10px;
    }

    #applied-queries {
    padding-right: 5px;
    }

    #graph-container {
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    .left {
    margin: 0px;
    float: left;
    width: 30%;
    display: flex;
    flex-direction: column;
    border-bottom:1px black solid;
    border-left:1px black solid;
    border-right:1px black solid;
    height: calc(100vh - 200px);
    }

    .content_graph{
        height: calc(100% - 50px);
    }

    .tree-view-container {
        height: 60%;
        overflow: auto;
        flex: 1;
    }

</style>

</head>
<body>
<div class="page">
      <div class="header">

          <div class="left-header">
              <h1>Graph Visualizer</h1>
          </div>

          <div class="right-header">

              <div class="workspace-management">
                <button id="createWorkspaceBtn" onclick="createWorkspace()">Create Workspace</button>
                <select id="workspace-select">
                    {% for workspace in workspaces %}
                        <option value="{{ forloop.counter0 }}">{{ workspace.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="top-right">
                <div class="plugins">
                    <label for="data-source-plugin">Data source plugin</label>
                    <select class="plugin-select" id="data-source-plugin">
                        {% for plugin_name in data_source_plugin_names %}
                            <option value="{{ plugin_name }}">{{ plugin_name }}</option>
                        {% endfor %}
                    </select>
                    <label for="visualizer-plugin">Visualizer plugin</label>
                    <select class="plugin-select" id="visualizer-plugin">
                        {% for plugin_name in visualizer_plugin_names %}
                            <option value="{{ plugin_name }}">{{ plugin_name }}</option>
                        {% endfor %}
                    </select>

                </div>

                <div class="search">
                    <label for="search">Search: </label><input id="search">
                    <button id="search-button" onclick="searchButtonClicked()"> Search </button>
                    <button id="reset-button" onclick="resetButtonClicked()"> Reset </button>
                </div>
            </div>

              <div class="center-right">
                  <div class="filter">
                      <label for="filter">Filter: </label><input id="filter">

                      <label for="select-comparator">Comparator: </label>
                        <select id="select-comparator">
                          <option value="==">==</option>
                          <option value=">">></option>
                          <option value=">=">>=</option>
                          <option value="<"><</option>
                          <option value="<="><=</option>
                          <option value="!=">!=</option>
                        </select>

                      <label for="value">Value: </label><input id="value">
                  </div>
                  <button onclick="addBubble()">Submit</button>
              </div>

              <div class="bottom-right">
                  <p id="applied-queries">Applied queries: </p>
                  <div id="bubbles-container"></div>
                    <script>
                        function addBubble() {
                            var filter = document.getElementById("filter").value;
                            var comparator = document.getElementById("select-comparator").value;
                            var value = document.getElementById("value").value;

                            if (filter && comparator && value) {
                                var bubbleContainer = document.getElementById("bubbles-container");

                                // Create bubble element
                                var bubble = document.createElement("div");
                                bubble.className = "bubble";
                                bubble.textContent = filter + " " + comparator + " " + value;

                                // Create delete button
                                var deleteBtn = document.createElement("span");
                                deleteBtn.className = "delete-btn";
                                deleteBtn.textContent = "X";
                                deleteBtn.onclick = function () {
                                    bubbleContainer.removeChild(bubble);
                                };

                                // Append delete button to bubble
                                bubble.appendChild(deleteBtn);

                                // Append bubble to container
                                bubbleContainer.appendChild(bubble);

                                // Clear input fields
                                document.getElementById("filter").value = "";
                                document.getElementById("select-comparator").value = "==";
                                document.getElementById("value").value = "";
                            }
                        }
                    </script>
              </div>

          </div>
      </div>
      <div class="content_graph">
          <div class="left">
              <div class="tree-view-container">
                  {% block treeview %}{% endblock %}
              </div>
          <div id="bird-view">
              <svg id="bird-graph-svg" viewBox="0 0 928 680" style="width: 100%; height: 100%;" preserveAspectRatio="xMidYMid meet">
                  <g id="bird-graph-g" transform="translate(271.5788644740471,88.54958197403138) scale(0.3)">

                  </g>

              </svg>
          </div>
          <script>

          </script>
      </div>
      <div class="center" id="main-view">
          <div id="graph-container">
              <svg id="center-graph-svg" viewBox="0 0 928 680" style="width: 100%;" preserveAspectRatio="xMidYMid meet">
                  <g id="center-graph-g" >
                    <rect id="bird-view-scope" width="" height=""></rect>

                  </g>
              </svg>
        <script src="https://d3js.org/d3.v7.min.js"></script>
            {{ visualization_html | safe }}
        <script>
            const svg = d3.select("#center-graph-svg");
            const g = d3.select("#center-graph-g");
            const birdSVG = d3.select("#bird-graph-svg");
            const rect = d3.select("#bird-view-scope");

            svg.append("defs")
                .append("marker")
                .attr("id", "arrowhead")
                .attr("markerWidth", 10)
                .attr("markerHeight", 7)
                .attr("refX", 10)
                .attr("refY", 3.5)
                .attr("orient", "auto")
                .append("polygon")
                .attr("points", "0 0, 10 3.5, 0 7")
                .attr("fill", "gray")

            const zoom = d3.zoom()
                .scaleExtent([1/2, 4]) // Set the minimum and maximum zoom levels
                .on("zoom", zoomed);

            svg.call(zoom);

            function zoomed(event) {
                g.attr("transform", event.transform);

                const centerTransform = event.transform;

                const scaleX = centerTransform.k;
                const scaleY = centerTransform.k;
                const translateX = centerTransform.x;
                const translateY = centerTransform.y;

                // Calculate the dimensions of the red rectangle based on the zoom level
                const viewBox = svg.attr("viewBox").split(" ");
                const viewBoxWidth = parseFloat(viewBox[2]);
                const viewBoxHeight = parseFloat(viewBox[3]);

                const rectWidth = viewBoxWidth / scaleX;
                const rectHeight = viewBoxHeight / scaleY;

                // Calculate the position of the red rectangle based on the translation
                const rectX = -translateX / scaleX;
                const rectY = -translateY / scaleY;

                // Update the existing red rectangle attributes
                rect.attr("x", rectX)
                    .attr("y", rectY)
                    .attr("width", rectWidth)
                    .attr("height", rectHeight)
                    .attr("stroke", "red")
                    .attr("stroke-width", 2)
                    .attr("fill", "none");
            }
        </script>
          </div>
      </div>
      </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
     $(document).ready(function() {
        // Function to update the bird-view div with the contents of the center div
        const centerG = $('#center-graph-g')
        const birdViewG =  $('#bird-graph-g')



         function updateBirdView() {
                var centerContents = centerG.contents().clone();
                birdViewG.empty().append(centerContents);
        }

        // Initial update
        updateBirdView();

        // Listen for common events in the document and update the bird-view accordingly
        function updateBirdViewOnTick() {
                updateBirdView();

                const svg = document.getElementById('bird-graph-svg');
                const nodes = svg.querySelectorAll('.node');

                const viewBoxValues = svg.getAttribute('viewBox').split(' ').map(Number);
                nodes.forEach(node => {

                    const transformAttr = node.getAttribute('transform');
                    const [translateX, translateY] = transformAttr.match(/translate\(([^,]+),([^)]+)\)/).slice(1).map(Number);
                    const rectElement = node.querySelector('rect');


                    const width = parseFloat(rectElement.getAttribute('width'));
                    const height = parseFloat(rectElement.getAttribute('height'));

                    const gElement = document.getElementById('bird-graph-g');

                    const transformAttrG = gElement.getAttribute('transform');
                    const [nodeTranslateX, nodeTranslateY] = transformAttrG.match(/translate\(([^,]+),([^)]+)\)/).slice(1).map(Number);
                    const scale = parseFloat(transformAttrG.match(/scale\((.*?)\)/)[1]);

                    const topLeft = { x: (nodeTranslateX + translateX) * scale, y: (nodeTranslateY + translateY) * scale };

                    const bottomRight = { x: (nodeTranslateX + translateX + width) * scale, y: (nodeTranslateY + translateY + height) * scale };

                    if (topLeft.x < viewBoxValues[0]) {
                        let distance = Math.abs(topLeft.x - viewBoxValues[0])
                        svg.setAttribute('viewBox', `${viewBoxValues[0] - distance} ${viewBoxValues[1]} ${viewBoxValues[2] + distance} ${viewBoxValues[3]}`);
                    }
                    if (topLeft.y < viewBoxValues[1]) {
                        let distance = Math.abs(topLeft.y - viewBoxValues[0])
                        svg.setAttribute('viewBox', `${viewBoxValues[0]} ${viewBoxValues[1] - distance} ${viewBoxValues[2]} ${viewBoxValues[3] + distance}`);
                    }
                    if (bottomRight.x > viewBoxValues[0] + viewBoxValues[2] - 200) {
                        let distance = Math.abs(bottomRight.x - (viewBoxValues[0] + viewBoxValues[2]))
                        svg.setAttribute('viewBox', `${viewBoxValues[0]} ${viewBoxValues[1]} ${viewBoxValues[2] + distance * 3} ${viewBoxValues[3]}`);
                    }
                    if (bottomRight.y > viewBoxValues[1] + viewBoxValues[3] - 100) {
                        let distance = Math.abs(bottomRight.y - (viewBoxValues[1] + viewBoxValues[3]))
                        svg.setAttribute('viewBox', `${viewBoxValues[0]} ${viewBoxValues[1]} ${viewBoxValues[2]} ${viewBoxValues[3] + distance * 2}`);
                    }

                });
            }

            setInterval(updateBirdViewOnTick, 1);
    });
    </script>
</div>

                            xhr.setRequestHeader("Content-Type", "application/json");

                            xhr.onreadystatechange = function () {
                                if (xhr.readyState === XMLHttpRequest.DONE) {
                                    if (xhr.status === 200) {
                                        var response = JSON.parse(xhr.responseText);
                                        // Rerender the graph
                                        rerenderGraph(response.visualization_html)
                                    } else {
                                        // Handle error
                                        console.error('Request failed with status:', xhr.status);
                                    }
                                }
                            };
                             var data = JSON.stringify({
                                dataSource: selectedDataSource,

                            xhr.onreadystatechange = function () {
                                if (xhr.readyState === XMLHttpRequest.DONE) {
                                    if (xhr.status === 200) {
                                        var response = JSON.parse(xhr.responseText);
                                        // Rerender the graph
                                        rerenderGraph(response.visualization_html)
                                    } else {
                                        // Handle error
                                        console.error('Request failed with status:', xhr.status);
                                    }
                                }
                            };
                             var data = JSON.stringify({
                                visualizer: selectedVisualizer,
                             });
                            xhr.send(data);
                        }

                        function getCookie(name) {
                        var cookieValue = null;
                        if (document.cookie && document.cookie !== '') {
                            var cookies = document.cookie.split(';');
                            for (var i = 0; i < cookies.length; i++) {
                                var cookie = cookies[i].trim();
                                // Check if the cookie name matches the CSRF token cookie name
                                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                                    // Extract and decode the CSRF token
                                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                                    break;
                                }
                            }
                        }
                        return cookieValue;
                    }

<script>
    document.getElementById("workspace-select").addEventListener("change", function () {
        switchWorkspace();
    });

    function createWorkspace() {
        var workspaceName = prompt('Enter workspace name: ');
         var xhr = new XMLHttpRequest();
         xhr.open("POST", "/create_workspace/", true);
         xhr.setRequestHeader("Content-Type", "application/json");
         xhr.setRequestHeader("X-CSRFToken", getCookie("csrftoken"));
         xhr.onreadystatechange = function () {
             if (xhr.readyState === XMLHttpRequest.DONE) {
                 if (xhr.status === 200) {
                     var response = JSON.parse(xhr.responseText);
                                        location.reload();
                 } else {
                                        // Handle error
                     console.error('Request failed with status:', xhr.status);
                 }
             }
         };
        var data = JSON.stringify({
            workspace_name: workspaceName,
        });
        xhr.send(data);
    }

    function switchWorkspace() {
        var selectElement = document.getElementById("workspace-select");
        var workspaceName = selectElement.options[selectElement.selectedIndex].textContent;

        var xhr = new XMLHttpRequest();
        xhr.open("POST", "/switch_workspace/", true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.setRequestHeader("X-CSRFToken", getCookie("csrftoken"));
        xhr.onreadystatechange = function () {
             if (xhr.readyState === XMLHttpRequest.DONE) {
                 if (xhr.status === 200) {
                     var response = JSON.parse(xhr.responseText);
                                        location.reload();
                 } else {
                                        // Handle error

                 }
             }
         };
        var data = JSON.stringify({
            workspace_name: workspaceName,
        });
        xhr.send(data);
    }
</script>
